name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to manually trigger this workflow from the Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          echo "Pinging https://m5-forecasting.onrender.com/ ..."
          curl -sS https://m5-forecasting.onrender.com/ > /dev/null
          echo "Ping successful!"
