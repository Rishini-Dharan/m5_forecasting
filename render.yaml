services:
  - type: web
    name: m5-forecasting-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      # Comma-separated frontend origins. Must be explicit: a wildcard is
      # incompatible with allow_credentials and browsers will reject it.
      - key: CORS_ORIGINS
        sync: false
      - key: NPN_REPO
        value: rishini/NPN
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DB_POOL_MIN
        value: 2
      - key: DB_POOL_MAX
        value: 10
